name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Siapkan google-services.json dari secret
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          test -n "$GSJ" || (echo "Secret GOOGLE_SERVICES_JSON_B64 belum diisi (base64 dari google-services.json)" && exit 1)
          echo "$GSJ" | base64 -d > google-services.json
      - run: npm install
      - run: npm run build
      - name: Buat proyek Android
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx cap sync android
      - name: Izin notifikasi Android 13+
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Latar aplikasi navy (tanpa kilat putih)
        run: |
          F=android/app/src/main/res/values/styles.xml
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowBackground">#06101F</item>' $F
          sed -i '/name="AppTheme"/a\        <item name="android:windowBackground">#06101F</item>' $F
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TST-Event-Control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
