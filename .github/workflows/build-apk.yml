name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Cek google-services.json
        run: test -f google-services.json || (echo "File google-services.json belum ada di root repo" && exit 1)
      - run: npm install
      - run: npm run build
      - name: Buat proyek Android
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx cap sync android
      - name: Izin notifikasi Android 13+
        run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TST-Event-Control-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
